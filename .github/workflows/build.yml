name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm run audit:dependencies

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Upload build artifacts
        # Run even on failure — partial artifacts help debug build/lint errors without re-running locally.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore

  package-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Cuotiben-Windows-Installer
          path: |
            dist-electron/releases/**/*.exe
            dist-electron/releases/**/*.blockmap
          if-no-files-found: error
          retention-days: 30
